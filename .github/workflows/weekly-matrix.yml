name: Weekly Model Matrix Update

on:
  schedule:
    # Daily 06:00 UTC health check; always refreshes on Mondays or whenever upstream docs/benchmarks change
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      auto_merge:
        description: "Automatically squash-merge the PR after CI validation passes"
        required: false
        default: true
        type: boolean
      force_update:
        description: "Force refresh telemetry, stats, README, and GitHub Pages even if routing rules are unchanged"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: weekly-matrix-update
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.open_pr.outputs.changed }}
      branch: ${{ steps.open_pr.outputs.branch }}
      pr_number: ${{ steps.open_pr.outputs.pr_number }}
      week_id: ${{ steps.open_pr.outputs.week_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate matrix, stats, history, README, and GitHub Pages
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_INPUT: ${{ inputs.force_update }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TRIGGER="workflow_dispatch"
            if [ "$FORCE_INPUT" = "false" ]; then
              EXTRA_FLAGS="--if-changed"
            else
              EXTRA_FLAGS="--force"
            fi
          else
            TRIGGER="ci-schedule"
            DAY_OF_WEEK=$(date -u +%u)
            if [ "$DAY_OF_WEEK" = "1" ]; then
              EXTRA_FLAGS="--force"
            else
              EXTRA_FLAGS="--if-changed"
            fi
          fi
          python scripts/generate_weekly_matrix.py --root . --allow-live-fetch --trigger "$TRIGGER" $EXTRA_FLAGS
      - name: Run zero-leak security scan
        run: python scripts/security_scan.py --root .
      - name: Run parity & schema verification
        run: python scripts/generate_weekly_matrix.py --root . --check
      - name: Run validation tests
        run: pytest -v
      - name: Open Pull Request for validated update
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WEEK_ID=$(python -c "import json; print(json.load(open('routing.json'))['week_id'])")
          BRANCH="chore/weekly-matrix-${WEEK_ID}-r${RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add routing.json stats.json history.json BEST_PRACTICES.md CHANGELOG.md llms.txt README.md docs/
          git commit -m "chore: update model matrix, stats & GitHub Pages (${WEEK_ID})"
          git push -u origin "$BRANCH" --force

          python - <<'PY' > /tmp/pr_body.md
          import json
          routing = json.load(open("routing.json", encoding="utf-8"))
          stats = json.load(open("stats.json", encoding="utf-8"))
          m = stats["metrics"]
          changes = stats["last_update"]["changes"]
          lines = [
              f"## Automated Model Matrix Update (`{routing['week_id']}`)",
              "",
              f"- **Generated At (UTC):** `{routing['generated_at']}`",
              f"- **Schema Version:** `{routing['schema_version']}`",
              f"- **Content Hash:** `{routing['content_hash'][:12]}`",
              f"- **Source Health:** `{m['sources_healthy']}/{m['sources_total']}` ({m['sources_health_pct']:.0f}% healthy, avg `{m['avg_source_latency_ms']} ms`)",
              f"- **Stage 5 (`app_build`) Policy:** Strictly pinned to **Gemini on Antigravity** (`{stats['stage_5_compliance']['primary_model']}`)",
              "",
              "### Changes in This Run",
              "",
          ]
          for item in changes:
              lines.append(f"- {item}")
          lines.extend([
              "",
              "### Verification Gate",
              "- Zero-leak security scan (`scripts/security_scan.py`): passed",
              "- JSON Schema, policy lock & `docs/` parity (`--check`): passed",
              "- Unit test suite (`pytest -v`): passed",
          ])
          print("\n".join(lines))
          PY

          gh pr create \
            --title "chore: update model matrix, stats & GitHub Pages (${WEEK_ID})" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "$BRANCH"

          PR_NUMBER=$(gh pr view "$BRANCH" --json number -q .number)
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "week_id=${WEEK_ID}" >> "$GITHUB_OUTPUT"

  verify:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate.outputs.branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Independent zero-leak security scan
        run: python scripts/security_scan.py --root .
      - name: Independent matrix, schema, README & docs parity check
        run: python scripts/generate_weekly_matrix.py --root . --check
      - name: Independent unit test verification
        run: pytest -v

  merge:
    needs: [generate, verify]
    if: needs.generate.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.auto_merge != false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.do_merge.outputs.merged }}
    steps:
      - name: Squash-merge verified PR into main
        id: do_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.generate.outputs.pr_number }}
          BRANCH: ${{ needs.generate.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" -R "$REPO" --squash
          gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}" || true
          echo "merged=true" >> "$GITHUB_OUTPUT"

  deploy_pages:
    needs: [generate, merge]
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Upload merged GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          retention-days: 1
      - name: Deploy latest GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
