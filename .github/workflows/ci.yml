name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run zero-leak security scan
        run: python scripts/security_scan.py --root .
      - name: Validate routing matrix, JSON Schema, README sync, and docs parity
        run: python scripts/generate_weekly_matrix.py --root . --check
      - name: Run unit tests
        run: pytest -v
