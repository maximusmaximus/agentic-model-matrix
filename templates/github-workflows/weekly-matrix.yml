name: Weekly Best-Practices & Model Matrix Update

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate weekly matrix and best practices
        run: python scripts/generate_weekly_matrix.py --root . --allow-live-fetch
      - name: Run zero-leak security scan
        run: python scripts/security_scan.py --root .
      - name: Run validation tests
        run: pytest -v
      - name: Open PR for human review (PR-gated activation)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet routing.json BEST_PRACTICES.md; then
            echo "No changes to routing matrix."
            exit 0
          fi
          WEEK_ID=$(python -c "import json; print(json.load(open('routing.json'))['week_id'])")
          BRANCH="chore/weekly-matrix-${WEEK_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add routing.json BEST_PRACTICES.md
          git commit -m "chore: weekly best-practices & model matrix (${WEEK_ID})"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "chore: weekly best-practices & model matrix (${WEEK_ID})" \
            --body "Automated weekly regeneration of \`BEST_PRACTICES.md\` and \`routing.json\`. Requires PR merge to activate downstream routing updates (Stage 5 app_build remains pinned to Gemini models on Antigravity)." \
            --base main \
            --head "$BRANCH" || echo "PR already exists for ${BRANCH}"
