name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run zero-leak security scan
        run: python scripts/security_scan.py --root .
      - name: Validate routing matrix and policy
        run: python scripts/generate_weekly_matrix.py --root . --check
      - name: Run unit tests
        run: pytest -v
